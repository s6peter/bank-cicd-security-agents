name: OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: security-remediation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Dump OIDC claims (not the token itself)
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "FAILED to obtain an OIDC token"; exit 1
          fi
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub", "repository", "repository_owner",
                    "environment", "ref", "workflow", "job_workflow_ref"):
              print(f"{k} = {claims.get(k)!r}")
          PY
