[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-cicd-security-agents"
version = "0.1.0"
description = "Policy-controlled multi-agent security remediation for regulated CI/CD"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "pydantic>=2.8,<3",
  "strands-agents>=1.48,<2",
]

[project.optional-dependencies]
agentcore = ["bedrock-agentcore>=1,<2", "bedrock-agentcore-starter-toolkit>=0.3,<1"]
dev = ["build>=1.2,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
banksec = "banksec_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
banksec_agents = ["resources/prompts/*.md", "resources/policies/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
